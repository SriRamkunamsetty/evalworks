services:
  evalworks:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "alembic upgrade head && uvicorn evalworks.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - evalworks-data:/app/.data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "evalworks.worker"]
    depends_on:
      evalworks:
        condition: service_healthy
    volumes:
      - evalworks-data:/app/.data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  evalworks-data:
