services:
  evalworks:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    command: ["sh", "-c", "alembic upgrade head && uvicorn evalworks.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - evalworks-data:/app/.data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  evalworks-data:
