services:
  agenthijack-auditor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenthijack-auditor
    ports:
      - "8004:8004"
    environment:
      - HOST=0.0.0.0
      - PORT=8004
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
