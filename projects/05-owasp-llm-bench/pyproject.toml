[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "owasp-llm-bench"
version = "0.1.0"
description = "Comprehensive OWASP Top 10 for LLMs Automated Compliance Benchmark"
authors = [{ name = "AI Security Tester", email = "security@alignerr-eval.local" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.scripts]
owaspbench = "owaspbench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
