services:
  vision-jailbreak:
    build:
      context: .
      dockerfile: Dockerfile
    image: vision-jailbreak:latest
    container_name: vision-jailbreak-svc
    ports:
      - "8009:8009"
    environment:
      - HOST=0.0.0.0
      - PORT=8009
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 5s
      retries: 3
