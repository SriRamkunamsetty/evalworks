name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: node --check src/evalworks/web/app.js
      - run: python -m evalworks.cli security-gate
      - run: python -m compileall -q src tests migrations
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv .venv-audit && .venv-audit/bin/python -m pip install --upgrade pip && .venv-audit/bin/python -m pip install -e . pip-audit && .venv-audit/bin/python -m pip_audit --skip-editable
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag evalworks:${{ github.sha }} .
