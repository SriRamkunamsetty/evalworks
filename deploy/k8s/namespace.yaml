apiVersion: v1
kind: Namespace
metadata:
  name: ai-security-mesh
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/part-of: alignerr-ai-security-suite
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-security-quota
  namespace: ai-security-mesh
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "30"
