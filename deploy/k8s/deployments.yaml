apiVersion: apps/v1
kind: Deployment
metadata:
  name: jailbreaklab-fuzzer
  namespace: ai-security-mesh
  labels:
    app: jailbreaklab-fuzzer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jailbreaklab-fuzzer
  template:
    metadata:
      labels:
        app: jailbreaklab-fuzzer
    spec:
      containers:
        - name: fuzzer
          image: ghcr.io/alignerr/jailbreaklab-fuzzer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: ai-security-config
            - secretRef:
                name: ai-security-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
