events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    upstream fuzzer { server jailbreaklab-fuzzer:8001; }
    upstream rag { server indirect-inject-rag:8002; }
    upstream canary { server canaryleak-scanner:8003; }
    upstream agent { server agenthijack-auditor:8004; }
    upstream owasp { server owasp-llm-bench:8005; }
    upstream crescendo { server crescendo-multiturn:8006; }
    upstream gate { server guardrailgate-devsecops:8007; }
    upstream calibrator { server safety-rubric-calibrator:8008; }
    upstream vision { server multimodal-vision-jailbreak:8009; }
    upstream aivd { server aivd-vulnerability-studio:8010; }

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /fuzzer/ {
            proxy_pass http://fuzzer/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /rag/ {
            proxy_pass http://rag/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /canary/ {
            proxy_pass http://canary/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /agent/ {
            proxy_pass http://agent/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /owasp/ {
            proxy_pass http://owasp/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /crescendo/ {
            proxy_pass http://crescendo/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /gate/ {
            proxy_pass http://gate/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /calibrator/ {
            proxy_pass http://calibrator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /vision/ {
            proxy_pass http://vision/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /aivd/ {
            proxy_pass http://aivd/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
