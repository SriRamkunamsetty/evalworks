apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalworks
  labels:
    app.kubernetes.io/name: evalworks
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evalworks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evalworks
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/OWNER/evalworks:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: evalworks-runtime
                  key: api-key
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: evalworks-runtime
                  key: session-secret
            - name: COOKIE_SECURE
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: evalworks-runtime
                  key: database-url
            - name: DATA_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: evalworks-runtime
                  key: data-hmac-key
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: evalworks
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: evalworks
  ports:
    - name: http
      port: 80
      targetPort: http
