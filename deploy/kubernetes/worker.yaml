apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalworks-worker
  labels:
    app.kubernetes.io/name: evalworks-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evalworks-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evalworks-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/OWNER/evalworks:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "evalworks.worker"]
          env:
            - name: APP_ENV
              value: production
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: evalworks-runtime
                  key: api-key
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: evalworks-runtime
                  key: session-secret
            - name: COOKIE_SECURE
              value: "true"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: evalworks-runtime
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: evalworks-runtime
                  key: database-url
            - name: DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: evalworks-runtime
                  key: data-encryption-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
